name: CI

on:
  push:
    branches: ['6.0']
  pull_request:

jobs:
  lint:
    name: Lint on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # This branch supports PHP 7.2 through 8.3. Linting the whole tree on each
      # of them is what keeps a change from silently raising the floor.
      - name: Lint every PHP file
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
