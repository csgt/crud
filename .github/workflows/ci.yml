name: CI

on:
  push:
    branches: ['master']
  pull_request:

jobs:
  lint:
    name: Lint on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # This branch supports PHP 7.2 through 8.3. Linting the whole tree on each
      # of them is what keeps a change from silently raising the floor.
      - name: Lint every PHP file
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  test:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The dev dependencies (phpunit ^9.6, illuminate ^8) need PHP 7.3 or
      # newer, which is why the test matrix starts above the lint one.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run the suite
        run: composer test
